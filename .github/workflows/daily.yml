name: Run quotidien

on:
  schedule:
    # Pas pile sur l'heure : c'est le créneau le plus chargé, où GitHub retarde ou saute les runs programmés.
    # GitHub ne garantit aucun horaire et saute des runs : trois créneaux, et l'étape « Édition du jour » ne
    # lance le pipeline que si l'édition d'aujourd'hui n'est pas déjà publiée.
    - cron: "17 4 * * *" # 4 h 17 UTC : 6 h 17 à Paris en été, 5 h 17 en hiver
    - cron: "43 6 * * *"
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      replay:
        description: Rejouer les items déjà vus sans rien publier (diagnostic)
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sans clé, le run est sauté au lieu de committer une trace d'erreur chaque jour.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: edition
        run: echo "done=$([ -f content/briefs/$(date -u +%F).json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Un lancement manuel passe toujours ; un lancement programmé saute si l'édition du jour existe déjà.
      - if: env.HAS_KEY == 'true' && (github.event_name == 'workflow_dispatch' || steps.edition.outputs.done == 'false')
        run: npm run pipeline -- ${{ inputs.replay && '--replay' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_BUDGET_USD: "2"
      # Le site revalide les données au build : une donnée qui le casse ne doit pas partir sur main,
      # où Cloudflare Pages garderait silencieusement l'ancien déploiement.
      - id: build
        if: always() && env.HAS_KEY == 'true'
        run: npm run build
      # La trace est commitée même si le run a échoué : les erreurs se voient sur le site.
      - if: always() && env.HAS_KEY == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "veille-ia-bot"
          git config user.email "veille-ia-bot@users.noreply.github.com"
          git add content runs data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(run): édition du $(date -u +%F)" && git push)
