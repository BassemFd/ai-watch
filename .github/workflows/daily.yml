name: Run quotidien

on:
  schedule:
    - cron: "0 4 * * *" # 4 h UTC : 6 h à Paris en été, 5 h en hiver
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_BUDGET_USD: "2"
      # La trace est commitée même si le run a échoué : les erreurs se voient sur le site.
      - if: always()
        run: |
          git config user.name "veille-ia-bot"
          git config user.email "veille-ia-bot@users.noreply.github.com"
          git add content runs data 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore(run): édition du $(date -u +%F)" && git push)
